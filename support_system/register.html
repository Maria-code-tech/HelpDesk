
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — HelpDesk</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
    <div class="container">
        <h1>HelpDesk</h1>
        <p>Система технической поддержки</p>
    </div>
</header>

<main class="container">

    <section class="welcome">

        <h2>Регистрация</h2>

        <form method="POST">

            <label for="username">Логин</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <label for="password">Пароль</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit" class="button">
                Зарегистрироваться
            </button>

        </form>

        <p>
            Уже есть аккаунт?
            <a href="/login">Войти</a>
        </p>

    </section>

</main>

</body>
</html>
